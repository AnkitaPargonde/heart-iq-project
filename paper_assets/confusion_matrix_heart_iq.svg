<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Heart-IQ Confusion Matrix</title>
  <desc id="desc">Confusion matrix for the deployed Heart-IQ logistic regression model on the PhysioNet/CinC 2016 test split.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f4"/>
      <stop offset="100%" stop-color="#fff1e8"/>
    </linearGradient>
    <linearGradient id="trueNormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c9f70"/>
      <stop offset="100%" stop-color="#2f7d57"/>
    </linearGradient>
    <linearGradient id="falseAbnormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="falseNormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="trueAbnormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6fcf97"/>
      <stop offset="100%" stop-color="#1f8b5b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7a3f2b" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 32px 'Georgia', serif; fill: #4b1f15; }
      .subtitle { font: 400 18px 'Arial', sans-serif; fill: #6f4a43; }
      .axis { font: 700 22px 'Arial', sans-serif; fill: #4b1f15; }
      .label { font: 700 20px 'Arial', sans-serif; fill: #fff8f4; }
      .small { font: 400 17px 'Arial', sans-serif; fill: #fff8f4; }
      .note { font: 400 18px 'Arial', sans-serif; fill: #6f4a43; }
      .legendText { font: 600 16px 'Arial', sans-serif; fill: #4b1f15; }
      .value { font: 700 34px 'Arial', sans-serif; fill: #fffdfb; }
      .valueDark { font: 700 34px 'Arial', sans-serif; fill: #4b1f15; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="600" y="70" text-anchor="middle" class="title">Heart-IQ Confusion Matrix</text>
  <text x="600" y="102" text-anchor="middle" class="subtitle">Logistic Regression model on the PhysioNet/CinC 2016 test split</text>

  <g filter="url(#shadow)">
    <rect x="180" y="160" width="840" height="480" rx="34" fill="#fffdfb" stroke="#f0d7c9" stroke-width="2"/>
  </g>

  <text x="600" y="205" text-anchor="middle" class="axis">Predicted Class</text>
  <text x="88" y="450" transform="rotate(-90 88 450)" text-anchor="middle" class="axis">True Class</text>

  <g>
    <rect x="390" y="245" width="210" height="170" rx="22" fill="url(#trueNormal)"/>
    <rect x="600" y="245" width="210" height="170" rx="22" fill="url(#falseAbnormal)"/>
    <rect x="390" y="415" width="210" height="170" rx="22" fill="url(#falseNormal)"/>
    <rect x="600" y="415" width="210" height="170" rx="22" fill="url(#trueAbnormal)"/>

    <rect x="390" y="245" width="420" height="340" rx="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <line x1="600" y1="245" x2="600" y2="585" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    <line x1="390" y1="415" x2="810" y2="415" stroke="#ffffff" stroke-width="3" opacity="0.75"/>

    <text x="495" y="297" text-anchor="middle" class="label">464</text>
    <text x="495" y="333" text-anchor="middle" class="small">90.1% correct</text>

    <text x="705" y="297" text-anchor="middle" class="label">51</text>
    <text x="705" y="333" text-anchor="middle" class="small">9.9% misclassified</text>

    <text x="495" y="467" text-anchor="middle" class="label">19</text>
    <text x="495" y="503" text-anchor="middle" class="small">7.1% misclassified</text>

    <text x="705" y="467" text-anchor="middle" class="label">247</text>
    <text x="705" y="503" text-anchor="middle" class="small">92.9% correct</text>
  </g>

  <g>
    <text x="495" y="608" text-anchor="middle" class="legendText">Predicted Normal</text>
    <text x="705" y="608" text-anchor="middle" class="legendText">Predicted Abnormal</text>
    <text x="330" y="332" text-anchor="middle" class="legendText" transform="rotate(-90 330 332)">True Normal</text>
    <text x="330" y="502" text-anchor="middle" class="legendText" transform="rotate(-90 330 502)">True Abnormal</text>
  </g>

  <g>
    <rect x="910" y="246" width="22" height="22" rx="5" fill="url(#trueNormal)"/>
    <text x="945" y="263" class="note">True Normal predicted as Normal</text>
    <rect x="910" y="286" width="22" height="22" rx="5" fill="url(#falseAbnormal)"/>
    <text x="945" y="303" class="note">True Normal predicted as Abnormal</text>
    <rect x="910" y="326" width="22" height="22" rx="5" fill="url(#falseNormal)"/>
    <text x="945" y="343" class="note">True Abnormal predicted as Normal</text>
    <rect x="910" y="366" width="22" height="22" rx="5" fill="url(#trueAbnormal)"/>
    <text x="945" y="383" class="note">True Abnormal predicted as Abnormal</text>
  </g>

  <text x="600" y="705" text-anchor="middle" class="subtitle">Confusion matrix values: [[464, 51], [19, 247]]</text>
</svg>
